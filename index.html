<!--
  ============================================================================
  index.html — Kalendar Application Entry Point
  ============================================================================
  The main HTML file loaded by Electron's BrowserWindow.

  Architecture:
    - React 17 + ReactDOM loaded from node_modules via require() (no build
      step / no JSX, and no CDN, so the app also starts offline)
    - react-big-calendar + its drag-and-drop addon + Moment.js for the calendar
    - Global alias `h = React.createElement` used by all components
    - Components loaded as plain <script> tags in dependency order
    - Styles: theme.css (CSS variables) + main.css (layout & components)

  Script loading order matters! Components that depend on other components
  must be loaded after their dependencies (e.g., CalendarView depends on
  MiniCalendar, DayTimeline, NextEventCountdown, etc.)
  ============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:;">
  <title>Kalendar - Nextcloud Calendar</title>
  <link rel="stylesheet" href="./node_modules/react-big-calendar/lib/css/react-big-calendar.css">
  <link rel="stylesheet" href="./node_modules/react-big-calendar/lib/addons/dragAndDrop/styles.css">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/theme.css">
</head>
<body>
  <div id="app"></div>
  
  <!-- Load dependencies from node_modules and expose them as globals.
       All of them must share this single React instance. -->
  <script>
    if (!process.env.NODE_ENV) process.env.NODE_ENV = "production";
    window.React = require("react");
    window.ReactDOM = require("react-dom");
    window.moment = require("moment");
    window.ReactBigCalendar = Object.assign({}, require("react-big-calendar"), {
      withDragAndDrop: require("react-big-calendar/lib/addons/dragAndDrop"),
    });
  </script>

  <!-- Global React.createElement alias used by all components -->
  <script>var h = React.createElement;</script>
  
  <!-- Load utilities -->
  <script src="./src/utils/helpers.js"></script>
    <!-- Load components -->
  <script src="./src/components/LoginForm.js"></script>
  <script src="./src/components/TaskManager.js"></script>
  <script src="./src/components/TaskModal.js"></script>
  <script src="./src/components/ProductivityHeatmap.js"></script>
  <script src="./src/components/DayTimeline.js"></script>
  <script src="./src/components/EventInsights.js"></script>
  <script src="./src/components/NextEventCountdown.js"></script>
  <script src="./src/components/MiniCalendar.js"></script>
  <script src="./src/components/CalendarView.js"></script>
  <script src="./src/components/EventModal.js"></script>
  <script src="./src/components/ContextMenu.js"></script>
  <script src="./src/components/CreateCalendarModal.js"></script>
  <script src="./src/components/CalendarSettingsModal.js"></script>
  <script src="./src/components/Settings.js"></script>
  
  <!-- Load main app -->
  <script src="./src/app.js"></script>
</body>
</html>
